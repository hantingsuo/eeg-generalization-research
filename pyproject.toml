[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pcma"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24,<2.0", "scipy>=1.9", "scikit-learn>=1.3", "pyriemann>=0.6", "torch>=2.0", "POT>=0.9", "mne>=1.8,<2.0", "openpyxl>=3.1", "PyYAML>=6.0,<7.0"]

[tool.setuptools.packages.find]
include = ["pcma*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
